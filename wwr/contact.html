<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="description"
      content="Contact Us - Extreme Rafting Adventures. Reach out for reservations, general inquiries, or website suggestions.">

    <meta name="author" content="Victor Hugo Colindres Corea">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Extreme Rafting Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Extreme Rafting Adventures Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO + MAP + FORM -->
        <section class="contact-info">

            <div class="company-details">
                <h1>Extreme Rafting Adventures</h1>
                <p>Suchitoto, Cuscatlán, El Salvador</p>
                <p>+503 2222-3333</p>
                <p><a href="mailto:info@extremerafting.com">info@extremerafting.com</a></p>
            </div>

            <div class="contact-layout">

                <!-- GOOGLE MAP -->
                <div class="map-container">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3872.3434410867144!2d-89.0159126262497!3d13.938144892954634!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f6369651f88c07b%3A0x4db2b5eba3ac060f!2sMirador%20Cascada%20Los%20Tercios%20-%20Suchitoto!5e0!3m2!1ses!2ssv!4v1775187575966!5m2!1ses!2ssv"
                      width="840" height="300" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade"
                      title="Mirador Cascada Los Tercios - Suchitoto, El Salvador">
                    </iframe>
                </div>

                <!-- CONTACT FORM -->
                <div class="contact-form">
                    <form action="#" method="post">

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your full name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email"
                              placeholder="your@email.com">
                        </div>

                        <div class="form-group">
                            <fieldset>
                                <legend>Message Purpose</legend>

                                <label>
                                    <input type="radio" name="purpose" value="general">
                                    General Inquiry
                                </label>

                                <label>
                                    <input type="radio" name="purpose" value="reservation">
                                    Reservation Question
                                </label>

                                <label>
                                    <input type="radio" name="purpose" value="suggestion">
                                    Website Suggestion
                                </label>
                            </fieldset>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5"
                              placeholder="Type here"></textarea>
                        </div>

                        <div class="form-group form-checkbox">
                            <label>
                                <input type="checkbox" name="newsletter" value="subscribe">
                                Please subscribe me to the monthly newsletter
                            </label>
                        </div>

                        <button type="submit">Get in Touch!</button>

                    </form>
                </div>

            </div>
        </section>

        <!-- EMPLOYEE PROFILES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpg.jpg" alt="Alex Rivera - Lead River Guide">
                    <figcaption>
                        <p>Alex Rivera</p>
                        <p>Lead River Guide</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg.jpg" alt="Jordan Lee - Safety Officer">
                    <figcaption>
                        <p>Jordan Lee</p>
                        <p>Safety Officer</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg.jpg"
                      alt="Morgan Smith - Customer Experience Manager">
                    <figcaption>
                        <p>Morgan Smith</p>
                        <p>Customer Experience Manager</p>
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Extreme Rafting Adventures | Victor Hugo Colindres Corea</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
