<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="description"
      content="Contact Extreme Rafting Adventures — reach out for reservations, general inquiries, or website suggestions. We're here to help you plan your next adventure.">

    <meta name="author" content="Victor Hugo Colindres Corea">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Extreme Rafting Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Extreme Rafting Adventures Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO + MAP + FORM -->
        <section class="contact-info">

            <div class="company-details">
                <h1>White Water Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
            </div>

            <div class="contact-layout">

                <!-- GOOGLE MAP -->
                <div class="map-container">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0!2d-122.4194!3d37.7749!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDA0JzI5LjYiTiAxMjLCsDI1JzA5LjkiVw!5e0!3m2!1sen!2sus!4v1234567890"
                      width="100%" height="300" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade" title="Company Location Map">
                    </iframe>
                </div>

                <!-- CONTACT FORM -->
                <div class="contact-form">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <fieldset>
                            <legend>Message Purpose</legend>

                            <label>
                                <input type="radio" name="purpose" value="general"> General Inquiry
                            </label>

                            <label>
                                <input type="radio" name="purpose" value="reservation"> Reservation
                                Question
                            </label>

                            <label>
                                <input type="radio" name="purpose" value="suggestion"> Website
                                Suggestion
                            </label>
                        </fieldset>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"
                          placeholder="Type here"></textarea>
                    </div>

                    <div class="form-group form-checkbox">
                        <label>
                            <input type="checkbox" name="newsletter" value="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>

                </div>
            </div>
        </section>

        <!-- EMPLOYEE PROFILES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpg.jpg" alt="Employee 1 - Lead Guide">
                    <figcaption>
                        <p>Alex Rivera</p>
                        <p>Lead River Guide</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg.jpg" alt="Employee 2 - Safety Officer">
                    <figcaption>
                        <p>Jordan Lee</p>
                        <p>Safety Officer</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg.jpg"
                      alt="Employee 3 - Customer Experience Manager">
                    <figcaption>
                        <p>Morgan Smith</p>
                        <p>Customer Experience Manager</p>
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Extreme Rafting Adventures | Victor Hugo Colindres Corea</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
